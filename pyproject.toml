[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "datahub-action-access-provisioner"
version = "0.1.20"
description = "DataHub Action to provision Snowflake or Databricks access and send email notifications on workflow approval"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [
    {name = "Jonny Dixon"}
]
dependencies = [
    "snowflake-connector-python>=3.0.0,<5.0.0",
    "pydantic>=2.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["action_access_provisioner*"]
exclude = ["tests*"]

[tool.setuptools.package-data]
action_access_provisioner = ["templates/*.html"]

[project.optional-dependencies]
databricks = [
    "databricks-sql-connector>=3.0.0",
    "databricks-sdk>=0.20.0",
]
# Snowflake OAUTH_AUTHENTICATOR with a Microsoft IdP needs MSAL. The Okta OAuth flow
# uses requests, which snowflake-connector-python already pulls in.
snowflake-oauth = [
    "msal>=1.20.0",
]
dev = [
    "acryl-datahub-actions>=1.0.0",
    "acryl-datahub>=1.0.0",
    "databricks-sql-connector>=3.0.0",
    "databricks-sdk>=0.20.0",
    "msal>=1.20.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-mock>=3.10.0",
    "types-PyYAML",
    "types-requests",
    "time-machine>=2.10.0",
]

[project.entry-points."datahub_actions.action.plugins"]
action-access-provisioner = "action_access_provisioner.access_provisioner_action:AccessProvisionerAction"
action-access-provisioner-databricks = "action_access_provisioner.databricks_access_provisioner_action:DatabricksAccessProvisionerAction"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
]
ignore = [
    "E501",  # line too long (handled by formatter)
]

[tool.ruff.lint.isort]
known-first-party = ["action_access_provisioner"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
strict_optional = true

[[tool.mypy.overrides]]
module = [
    "datahub.*",
    "datahub_actions.*",
    "snowflake.*",
    "_pytest.*",
    "pytest.*",
]
ignore_missing_imports = true

# Don't follow into the Databricks SDK/connector or their heavy transitive deps
# (pyarrow/numpy). Their bundled type stubs use PEP 695 syntax that mypy rejects
# under python_version 3.10, and we only use them via lazy runtime imports.
[[tool.mypy.overrides]]
module = [
    "databricks",
    "databricks.*",
    "numpy",
    "numpy.*",
    "pyarrow",
    "pyarrow.*",
    "pandas",
    "pandas.*",
]
follow_imports = "skip"
follow_imports_for_stubs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
markers = [
    "integration: marks tests as integration tests (deselect with '-m \"not integration\"')",
]
addopts = "-m 'not integration'"
