# Example configuration for the Databricks Access Provisioner action
#
# Author: Jonny Dixon
#
# This is the Databricks counterpart of example_action.yaml. It provisions
# Unity Catalog grants (instead of Snowflake roles) and stores all state in
# Delta tables. The durability model is identical: run as a long-lived daemon
# (the background reconciliation loop re-runs the catchup pass on an interval,
# picking up any missed live event within interval_seconds) or on a schedule
# (e.g. every 30 minutes) where the startup catchup gives the same guarantee.
# Each pass provisions new approvals, revokes expired grants, and sends SLA
# reminders; all one-shot emails are gated by the exactly-once ledger so
# duplicate or replayed events never notify twice.
#
# KEY DIFFERENCES FROM SNOWFLAKE
# ------------------------------
#   * The grantee is the requestor's email (a Databricks principal), not a role.
#   * The target catalog.schema.table is derived from the dataset the request was
#     raised on — never from form fields. The dataset's platform_instance prefix
#     is stripped, so it can't change what gets granted.
#   * Grants are applied via the SQL warehouse (grant_method: sql) or the Unity
#     Catalog grants API (grant_method: sdk).

# =============================================================================
# DATAHUB CLOUD DEPLOYMENT (recommended)
# =============================================================================
name: access-provisioner-databricks

source:
  type: datahub_integrations.sources.remote_actions.remote_action_source.RemoteActionSource
  config:
    action_urn: "urn:li:dataHubAction:access-provisioner-databricks"
    stage: live
    action_spec:
      type: "action-access-provisioner-databricks"
      config:
        # ----------------------------------------------------------------
        # Databricks connection (executes grants + holds Delta state tables)
        # A SQL warehouse is always required — set http_path or warehouse_id.
        # The same auth mechanisms as the Unity Catalog ingestion connector are
        # supported (all flow through the SDK credential chain). Pick ONE:
        # ----------------------------------------------------------------
        databricks_connection:
          host: "https://dbc-xxxxxxxx-xxxx.cloud.databricks.com"
          http_path: "/sql/1.0/warehouses/abc123def456"
          # warehouse_id: "abc123def456"          # alternative to http_path
          token: "${DATABRICKS_TOKEN}"            # 1) PAT auth
          # --- 2) OAuth machine-to-machine (Databricks service principal) ---
          # client_id: "${DATABRICKS_CLIENT_ID}"
          # client_secret: "${DATABRICKS_CLIENT_SECRET}"
          # --- 3) Azure AD service principal (Azure Databricks) ---
          # azure_auth:
          #   client_id: "${AZURE_CLIENT_ID}"
          #   tenant_id: "${AZURE_TENANT_ID}"
          #   client_secret: "${AZURE_CLIENT_SECRET}"
          # --- 4) Unified auth: set none of the above and let the Databricks SDK
          #        resolve credentials from its env vars / config profile chain. ---

        # ----------------------------------------------------------------
        # State / log tables (Delta, in Unity Catalog).
        # The catalog + schema must already exist; the provisioner role needs
        # CREATE TABLE on the schema. Tables are created on first run.
        # ----------------------------------------------------------------
        state:
          catalog: "datahub"
          schema: "access_provisioner"
          grants_table: "access_provisioner_grants"                 # default
          sla_table: "access_provisioner_sla_notifications"         # default
          errors_table: "access_provisioner_errors"                 # default
          ledger_table: "access_provisioner_ledger"                 # default; exactly-once notification ledger

        # ----------------------------------------------------------------
        # SMTP (outbound email notifications) — OPTIONAL. Omit this whole block
        # to disable all email notifications (approvals, denials, SLA reminders,
        # revocations); provisioning, expiry and state tracking still run.
        # Defaults target Resend: username is the literal "resend", password is
        # your API key, and from_address MUST be a verified domain sender.
        # ----------------------------------------------------------------
        smtp:
          host: "smtp.resend.com"
          port: 587
          username: "resend"
          password: "${RESEND_API_KEY}"
          from_address: "DataHub Access Bot <datahub-noreply@yourdomain.com>"
          use_tls: true

        # ----------------------------------------------------------------
        # SLA monitoring (each threshold fires at most once per request)
        # ----------------------------------------------------------------
        sla:
          warning_after_hours: 24
          escalation_after_hours: 72
          escalation_recipients:
            - "data-governance@yourdomain.com"

        # ----------------------------------------------------------------
        # Access expiry / auto-revocation
        # ----------------------------------------------------------------
        expiry:
          enabled: true
          revocation_notification: true

        # ----------------------------------------------------------------
        # Background reconciliation loop — re-runs the catchup pass on an
        # interval so a live event missed while the process was down or
        # rebalancing is picked up within interval_seconds. Idempotent (state
        # tables + exactly-once ledger). Recommended for daemon deployments.
        # ----------------------------------------------------------------
        reconcile:
          enabled: true
          interval_seconds: 300              # worst-case delay for a missed event (min 30)

        # ----------------------------------------------------------------
        # Databricks provisioning options
        # ----------------------------------------------------------------
        provisioning:
          grant_method: "sql"     # "sql" (via warehouse) or "sdk" (UC grants API)
          dry_run: false          # true to log grants without applying them
          # How a requested group (field_databricks_group) is honoured:
          #   "grant"      — GRANT the object TO the group (default)
          #   "membership" — add the requestor as a member of the group (the group
          #                  already holds the grants); removed again on expiry.
          #                  Always uses the SDK; IdP-reconcilable (e.g. Entra ID).
          # group_access_mode: "grant"

        # ----------------------------------------------------------------
        # Optional: open a Jira / ServiceNow ticket on approval.
        #   mode: augment  -> grant access AND file a ticket (audit / hand-off)
        #   mode: replace  -> skip the grant; only file a ticket for manual fulfilment
        # Omit this block entirely to provision in Databricks only.
        # ----------------------------------------------------------------
        # ticketing:
        #   provider: "jira"                 # "jira" or "servicenow"
        #   mode: "augment"
        #   base_url: "https://yourco.atlassian.net"
        #   username: "svc-account@yourco.com"
        #   api_token: "${TICKETING_API_TOKEN}"
        #   jira_project_key: "ACCESS"       # required for provider: jira
        #   jira_issue_type: "Task"
        #   # servicenow_table: "incident"   # for provider: servicenow
        #   dry_run: false

        # ----------------------------------------------------------------
        # Optional: how DataHub requestors map to Databricks principals (emails).
        # By default the corpuser id is used when it is already an email, otherwise
        # the email is read from the requestor's DataHub profile. Add explicit
        # overrides for users whose DataHub id is neither (common with SSO).
        # ----------------------------------------------------------------
        # identity:
        #   resolve_email_from_datahub: true
        #   principal_overrides:
        #     "urn:li:corpuser:jsmith": "jane.smith@corp.com"
        #     "bkumar": "bharat.kumar@corp.com"
        #   # Same idea for groups, when the DataHub group name and the Databricks
        #   # group name differ. Without an override the display name is read from
        #   # the DataHub profile, falling back to the id in the corpGroup URN.
        #   resolve_group_name_from_datahub: true
        #   group_overrides:
        #     "urn:li:corpGroup:analytics-team": "uc_analytics"

        # ----------------------------------------------------------------
        # Optional: mirror granted access back into DataHub as role/actors/access
        # aspects for a queryable "who has access" audit view. Read-only mirror of
        # Unity Catalog — editing DataHub never changes Databricks. Both group grants
        # (urn:li:role:<prefix>.<group>) and individual user grants
        # (urn:li:role:<prefix>.user.<email>) are mirrored.
        # ----------------------------------------------------------------
        # datahub_sync:
        #   enabled: true              # off by default
        #   role_urn_prefix: "databricks"   # role URNs: urn:li:role:databricks.<group>
        #   platform: "databricks"
        #   env: "PROD"                # must match how the datasets were ingested
        #   # Must match the platform_instance the datasets were ingested under, or the
        #   # mirror attaches access to a dataset URN that does not exist.
        #   platform_instance: "my_workspace"
        #   # request_url: "https://your-datahub/..."  # optional link on the role

        # ----------------------------------------------------------------
        # Which approved workflow requests to act on.
        #
        # Every workflow in your deployment — deprecation, ownership change,
        # revocation — can be raised against the same datasets and reaches
        # COMPLETED/ACCEPTED in exactly the same way. Without a filter, approving
        # a revocation request would grant access.
        #
        # By default the provisioner acts only on requests whose form carries a
        # field only an access request would set (duration, group, or a Snowflake
        # role/database), which excludes metadata and revocation workflows with no
        # configuration. Add an allow/deny pattern — same semantics as an ingestion
        # connector's filters — to name your access workflows explicitly. It is
        # matched against both the workflow's display name and its URN.
        # ----------------------------------------------------------------
        # workflow_filter:
        #   workflow:
        #     allow:
        #       - "Dataset Access Request"
        #       - "Data Product Access Request"
        #     deny:
        #       - ".*Revocation.*"
        #   require_access_fields: true   # set false if your access form has none of those fields

        # ----------------------------------------------------------------
        # Catchup window — how far back to scan DataHub for approved requests
        # ----------------------------------------------------------------
        lookback_days: 90

        # ----------------------------------------------------------------
        # Workflow form field IDs — must match your DataHub workflow form.
        # The grant target is derived from the dataset entity, and the principal
        # from the requestor's corpuser email, so the form only needs these.
        # Add field_databricks_group only if you offer group-based access.
        # ----------------------------------------------------------------
        field_access_duration_days: "access_duration_days"
        field_justification: "justification"
        # Optional: a form field holding a Databricks group to grant to instead of
        # the individual requestor (group-based access). Leave the form field empty
        # to grant to the requestor's own identity. A DataHub group picker supplies a
        # corpGroup URN, which is resolved to the group name (see identity below).
        # field_databricks_group: "databricks_group"
        # Optional: a form field naming who the access is for, when that is not the
        # person raising the request — delegated requests, and service accounts that
        # cannot raise their own. Accepts a corpuser URN or a bare email.
        # field_requested_for: "requested_for"

datahub:
  server: "https://your-datahub-instance.acryl.io/gms"
  token: "${DATAHUB_TOKEN}"

# When creating the ingestion source in the DataHub Cloud UI, add the Databricks
# extras under Step 5 → Advanced → Extra Pip Libraries, e.g.:
#   ["/datahub-integrations-service", "datahub-action-access-provisioner[databricks]"]

