#   config:
#     kill_after_idle_timeout: false
#
# action:
#   type: "action-access-provisioner-databricks"
#   config:
#     <same config block as action_spec.config above>
#
# datahub:
#   server: "https://your-datahub-instance.acryl.io/gms"
#   token: "${DATAHUB_TOKEN}"
