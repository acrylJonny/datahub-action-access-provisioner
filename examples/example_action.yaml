# Example configuration for the Access Provisioner action
#
# Author: Jonny Dixon
#
# TWO RUN MODES
# -------------
# 1. DataHub Cloud (managed) — recommended for production.
#    Register the action with DataHub Cloud using the RemoteActionSource format
#    (see "DataHub Cloud deployment" section below).  The Cloud executor manages
#    scheduling and restarts; the action runs every 30 minutes automatically.
#
# 2. Local / self-hosted — for development and testing.
#    Use `source.type: "datahub-cloud"` and run with:
#      datahub actions -c examples/example_action.yaml
#
# SCHEDULING NOTE
# ---------------
# The action supports two deployment models, both durable and exactly-once:
#   - Long-lived daemon (recommended): the background reconciliation loop
#     (`reconcile.enabled: true`, below) re-runs the catchup pass on an interval,
#     so a live event missed while the process was down or rebalancing is picked
#     up within `interval_seconds` instead of waiting for a restart.
#   - Scheduled invocation: if the executor kills idle actions, run on a schedule
#     (e.g. every 30 minutes); the startup catchup gives the same guarantee.
#
# On each invocation / reconcile pass the action:
#   1. Runs a catchup pass:
#        - Fetches all COMPLETED/APPROVED requests from the last N days
#        - Skips any already recorded in the Snowflake state table (idempotent)
#        - Skips any recorded as a permanent failure (errors table)
#        - Provisions Snowflake access + emails for any new approvals
#        - Revokes any grants whose access_duration has expired
#        - Sends SLA reminders for pending requests (deduped via state table)
#      All one-shot emails are gated by the exactly-once ledger, so duplicate or
#      replayed events never send a second notification.
#   2. Listens for live events for the remaining idle window
#
# =============================================================================
# DATAHUB CLOUD DEPLOYMENT (recommended)
# =============================================================================
# When deploying as a managed action in DataHub Cloud, use the RemoteActionSource.
# The action config moves inside `source.config.action_spec` and is registered
# with a stable URN so DataHub Cloud can schedule and track it.

name: access-provisioner

source:
  type: datahub_integrations.sources.remote_actions.remote_action_source.RemoteActionSource
  config:
    action_urn: "urn:li:dataHubAction:access-provisioner"
    stage: live
    action_spec:
      type: "action-access-provisioner"
      config:
        # ----------------------------------------------------------------
        # Snowflake connection (executes GRANT / REVOKE statements)
        # ----------------------------------------------------------------
        snowflake_connection:
          account_id: "xy12345"              # e.g. xy12345.us-east-1
          username: "datahub_provisioner"
          password: "${SNOWFLAKE_PASSWORD}"
          warehouse: "COMPUTE_WH"
          role: "SYSADMIN"                   # Must have GRANT OPTION privilege
          authentication_type: "DEFAULT_AUTHENTICATOR"
          # snowflake_domain: "snowflakecomputing.com"   # use ...cn for China regions
          # connect_args: {}                             # extra snowflake.connector.connect kwargs
          #
          # The same authentication mechanisms as the DataHub Snowflake ingestion
          # connector are supported. Pick ONE authentication_type:
          #
          # 1) DEFAULT_AUTHENTICATOR  — username + password (above).
          #
          # 2) KEY_PAIR_AUTHENTICATOR — RSA key pair (recommended for automation):
          #      authentication_type: "KEY_PAIR_AUTHENTICATOR"
          #      private_key: "${SNOWFLAKE_PRIVATE_KEY}"      # inline PEM, or:
          #      private_key_path: "/secrets/snowflake_key.p8"
          #      private_key_password: "${SNOWFLAKE_KEY_PASSPHRASE}"  # if encrypted
          #
          # 3) OAUTH_AUTHENTICATOR    — token fetched from Microsoft/Okta:
          #      authentication_type: "OAUTH_AUTHENTICATOR"
          #      oauth_config:
          #        provider: "microsoft"          # or "okta"
          #        authority_url: "https://login.microsoftonline.com/<tenant>/oauth2/v2.0/token"
          #        client_id: "${OAUTH_CLIENT_ID}"
          #        scopes: ["session:role:SYSADMIN"]
          #        client_secret: "${OAUTH_CLIENT_SECRET}"        # secret-based, OR:
          #        # use_certificate: true                         # Microsoft only
          #        # encoded_oauth_public_key: "${OAUTH_PUB_B64}"
          #        # encoded_oauth_private_key: "${OAUTH_PRIV_B64}"
          #
          # 4) OAUTH_AUTHENTICATOR_TOKEN — supply a pre-minted OAuth token:
          #      authentication_type: "OAUTH_AUTHENTICATOR_TOKEN"
          #      token: "${SNOWFLAKE_OAUTH_TOKEN}"
          #
          # 5) EXTERNAL_BROWSER_AUTHENTICATOR — interactive SSO (local/dev only; it
          #    cannot complete on the headless remote executor):
          #      authentication_type: "EXTERNAL_BROWSER_AUTHENTICATOR"

        # ----------------------------------------------------------------
        # Persistent state tables
        # Tracks provisioned grants and sent notifications across runs.
        # The schema must already exist; the tables are created on first run.
        # ----------------------------------------------------------------
        state:
          database: "DATAHUB"
          schema: "ACCESS_PROVISIONER"
          grants_table: "ACCESS_PROVISIONER_GRANTS"          # default
          sla_table: "ACCESS_PROVISIONER_SLA_NOTIFICATIONS"  # default
          errors_table: "ACCESS_PROVISIONER_ERRORS"          # default; permanent-failure tombstones
          ledger_table: "ACCESS_PROVISIONER_LEDGER"          # default; exactly-once notification ledger

        # ----------------------------------------------------------------
        # SMTP (outbound email notifications) — OPTIONAL. Omit this whole block
        # to disable all email notifications (approvals, denials, SLA reminders,
        # revocations); provisioning, expiry and state tracking still run.
        # Defaults target Resend: username is the literal "resend", password is
        # your API key, and from_address MUST be a verified domain sender.
        # ----------------------------------------------------------------
        smtp:
          host: "smtp.resend.com"
          port: 587
          username: "resend"
          password: "${RESEND_API_KEY}"
          from_address: "DataHub Access Bot <datahub-noreply@yourdomain.com>"
          use_tls: true

        # ----------------------------------------------------------------
        # SLA monitoring
        # Each threshold fires at most once per request (deduped in state table).
        # ----------------------------------------------------------------
        sla:
          warning_after_hours: 24            # Send reminder after 24 h
          escalation_after_hours: 72         # Escalate after 72 h
          escalation_recipients:             # CC'd on escalation emails
            - "data-governance@yourdomain.com"

        # ----------------------------------------------------------------
        # Access expiry / auto-revocation
        # ----------------------------------------------------------------
        expiry:
          enabled: true
          revocation_notification: true      # Email requestor on revocation

        # ----------------------------------------------------------------
        # Background reconciliation loop
        # Re-runs the full catchup pass (approvals / expiry / SLA) on an
        # interval so any live event missed while the process was down or
        # rebalancing is still picked up within interval_seconds, rather than
        # waiting for the next restart. Every pass is idempotent (state tables +
        # the exactly-once ledger). Strongly recommended for long-lived daemon
        # deployments; harmless (redundant) for purely scheduled invocations.
        # ----------------------------------------------------------------
        reconcile:
          enabled: true
          interval_seconds: 300              # worst-case delay for a missed event (min 30)

        # ----------------------------------------------------------------
        # Snowflake provisioning options
        # ----------------------------------------------------------------
        provisioning:
          default_warehouse: "COMPUTE_WH"    # Granted alongside database access
          dry_run: false                     # Set true to test without executing

        # ----------------------------------------------------------------
        # Catchup window — how far back to scan DataHub for approved requests
        # on each startup pass. Requests outside this window are assumed
        # already handled. 90 days is a safe default.
        # ----------------------------------------------------------------
        lookback_days: 90

        # ----------------------------------------------------------------
        # Workflow form field IDs
        # Must match the `id` values defined in your DataHub workflow form.
        # ----------------------------------------------------------------
        field_snowflake_database: "snowflake_database"
        field_snowflake_schema: "snowflake_schema"
        field_snowflake_role: "snowflake_role"
        field_access_duration_days: "access_duration_days"
        field_requestor_email: "requestor_email"
        field_justification: "justification"

datahub:
  server: "https://your-datahub-instance.acryl.io/gms"
  token: "${DATAHUB_TOKEN}"

# =============================================================================
# LOCAL / SELF-HOSTED (development and testing)
# =============================================================================
# To test locally against a DataHub Cloud instance, replace the source block
# above with the following and run:
#   datahub actions -c examples/example_action.yaml
#
# name: access-provisioner
#
# source:
#   type: "datahub-cloud"
#   config:
#     kill_after_idle_timeout: false
#
# action:
#   type: "action-access-provisioner"
#   config:
#     <same config block as action_spec.config above>
#
# datahub:
#   server: "https://your-datahub-instance.acryl.io/gms"
#   token: "${DATAHUB_TOKEN}"
